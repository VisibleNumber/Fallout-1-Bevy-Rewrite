name: Asset-free tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fallout-research/test.mjs
      - run: node tools/fallout-research/bytecode.test.mjs
      - run: node tools/fallout-research/vm.test.mjs
      - run: node tools/fallout-research/scalar-host.test.mjs
      - run: node tools/fallout-research/pointer-vm.test.mjs
      - run: node tools/fallout-research/world.test.mjs
      - run: node tools/fallout-research/world-host.test.mjs
      - run: node tools/fallout-research/character.test.mjs
      - run: node tools/fallout-research/variables.test.mjs
