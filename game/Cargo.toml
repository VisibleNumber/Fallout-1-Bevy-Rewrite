[package]
name = "fallout-rewrite"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "=0.17.3", default-features = false, features = ["std", "reflect_auto_register", "async_executor", "multi_threaded", "bevy_asset", "bevy_color", "bevy_core_pipeline", "bevy_anti_alias", "bevy_post_process", "bevy_gltf", "bevy_log", "bevy_pbr", "bevy_render", "bevy_scene", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_window", "bevy_winit", "bevy_gizmos", "bevy_text", "bevy_ui", "bevy_ui_render", "default_font", "png", "tonemapping_luts", "ktx2", "zstd_rust"] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
